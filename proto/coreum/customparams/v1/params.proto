syntax = "proto3";
package coreum.customparams.v1;

import "gogoproto/gogo.proto";

option go_package = "github.com/tokenize-x/tx-chain/v7/x/customparams/types";

// StakingParams defines the set of additional staking params for the staking module wrapper.
message StakingParams {
  // min_self_delegation is the validators global self declared minimum for delegation.
  string min_self_delegation = 1 [
    (gogoproto.moretags) = "yaml:\"min_self_delegation\"",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  // max_voting_power is the maximum percentage of total bonded tokens that any single
  // validator can have. Expressed as a decimal fraction (e.g. "0.10" = 10%).
  // A value of "1.00" (100%) means no cap is enforced.
  string max_voting_power = 2 [
    (gogoproto.moretags) = "yaml:\"max_voting_power\"",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
}
